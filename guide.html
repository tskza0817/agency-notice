<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONE-MiLife GROUP ご紹介資料</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: linear-gradient(135deg, #1e3a5f 0%, #14283f 100%);
  }
  .pdf-frame {
    height: 70vh;
  }
  @media (min-width: 768px) {
    .pdf-frame {
      height: 900px;
    }
  }
</style>
</head>
<body class="min-h-screen flex flex-col text-white">

  <header class="w-full py-6 px-4 text-center shadow-lg bg-[#1e3a5f]/80 backdrop-blur">
    <h1 class="text-xl sm:text-2xl md:text-3xl font-bold tracking-wide">
      ONE-MiLife GROUP ご紹介資料
    </h1>
    <p class="mt-2 text-sm sm:text-base text-blue-100">
      資料をスクロールしてご覧いただけます
    </p>
  </header>

  <main class="flex-1 flex items-center justify-center px-2 sm:px-6 py-6">
    <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl overflow-hidden">
      <embed src="guide.pdf" type="application/pdf" class="pdf-frame w-full" />
    </div>
  </main>

  <footer class="w-full py-6 px-4 flex flex-col sm:flex-row items-center justify-center gap-4 bg-[#1e3a5f]/80 backdrop-blur">
    <a href="index.html"
       class="px-6 py-2 rounded-full bg-white text-[#1e3a5f] font-semibold shadow hover:bg-blue-100 transition">
      トップへ戻る
    </a>
    <button onclick="window.close()"
       class="px-6 py-2 rounded-full border border-white text-white font-semibold hover:bg-white hover:text-[#1e3a5f] transition">
      閉じる
    </button>
  </footer>

</body>
</html>
